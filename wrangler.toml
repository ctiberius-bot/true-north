name = "true-north-citadel"
main = "worker.js"
compatibility_date = "2026-10-06"
workers_dev = true
routes = [
  { pattern = "truenorth.justsignal.company", custom_domain = true }
]

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.svg"]
fallthrough = true

[vars]
AI_GENERATION_ENABLED = "false"

[observability]
enabled = false

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "true-north-citadel"
database_id = "ad8374c7-a2fa-410e-bded-652de8f04fd0"

[[services]]
binding = "GMAIL_TOKEN_PROVIDER"
service = "true-north-citadel-oauth-core"

# No cron is configured in test mode. Add scheduling only after the read-only
# Gmail credential provider and production run handler are separately approved.

